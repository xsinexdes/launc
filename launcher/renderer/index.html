<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <canvas id="stars" width="1000" height="600"></canvas>
    <div class="planet"></div>
  </div>

  <header class="titlebar">
    <div class="wc">
      <button id="btn-settings" aria-label="Ajustes" title="Ajustes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.6A7.6 7.6 0 0 0 7 6.6l-2.4-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg>
      </button>
      <button id="btn-min" aria-label="Minimizar" title="Minimizar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="btn-close" class="close" aria-label="Cerrar" title="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="brand">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4a2ff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
          <circle cx="20" cy="20" r="11" fill="url(#g)"/>
          <ellipse cx="20" cy="20" rx="18" ry="5.5" fill="none" stroke="#ff7a8a" stroke-width="1.8" transform="rotate(-22 20 20)"/>
        </svg>
        <h1 id="name">Nova</h1>
      </div>
      <p class="tagline" id="tagline"></p>

      <div class="seg" id="seg" data-active="offline" role="tablist" aria-label="Tipo de cuenta">
        <span class="thumb"></span>
        <button role="tab" data-type="offline" aria-selected="true">No premium</button>
        <button role="tab" data-type="microsoft" aria-selected="false">Premium</button>
      </div>

      <div id="pane-offline" class="pane">
        <label for="user">Tu nombre en el juego</label>
        <input id="user" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Steve">
        <p id="hint" class="hint">De 3 a 16 caracteres: letras, números y guion bajo.</p>
      </div>

      <div id="pane-ms" class="pane" hidden>
        <button id="ms-login" class="secondary">Iniciar sesión con Microsoft</button>
        <div id="ms-account" class="account" hidden>
          <div><span class="muted">Sesión iniciada como</span><strong id="ms-name"></strong></div>
          <button id="ms-logout" class="ghost">Cerrar sesión</button>
        </div>
        <p id="ms-hint" class="hint">Se abrirá una ventana de Microsoft. Solo se inicia sesión una vez.</p>
      </div>

      <div class="spacer"></div>

      <button id="play" class="play" disabled><span class="fill"></span><span class="label">Jugar</span></button>
      <p id="status" class="status" role="status" aria-live="polite">&nbsp;</p>

      <footer class="srv">
        <span id="dot" class="dot"></span>
        <span id="online">Buscando servidor…</span>
        <button id="copy-ip" class="ghost" title="Copiar la IP"></button>
      </footer>
    </section>

    <section class="news">
      <h2>Novedades</h2>
      <div id="news-list"></div>
      <div class="links" id="links"></div>
    </section>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Ajustes">
    <h3>Ajustes</h3>
    <div class="row">
      <label for="ram">Memoria para Minecraft</label>
      <div class="ram"><input id="ram" type="range" min="2" max="16" step="1"><output id="ram-out">4 GB</output></div>
    </div>
    <label class="check"><input id="close-on-play" type="checkbox"><span class="box"></span>Cerrar el launcher cuando abra el juego</label>
    <button id="open-folder" class="secondary">Abrir carpeta del juego</button>
    <button id="repair" class="secondary">Reparar instalación</button>
    <p class="hint" id="repair-msg"></p>
    <p class="muted foot" id="ver"></p>
    <button id="drawer-close" class="ghost">Cerrar ajustes</button>
  </aside>

  <script src="app.js"></script>
</body>
</html>
