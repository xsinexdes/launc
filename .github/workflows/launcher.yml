name: Compilar launcher

on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Instalar dependencias
        working-directory: launcher
        run: npm install --no-audit --no-fund

      - name: Compilar el .exe
        working-directory: launcher
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Guardar los .exe
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: |
            launcher/dist/NovaLauncher-portable.exe
            launcher/dist/NovaLauncher-instalador.exe

      - name: Publicar en Releases (solo si subes una etiqueta v1, v2...)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            launcher/dist/NovaLauncher-portable.exe
            launcher/dist/NovaLauncher-instalador.exe
